<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="logo">Blood Donation</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/contact">Contact</a>
    </div>
</nav>

<section class="section">

    <h2>Reset Admin Password</h2>

    <div class="card" style="margin: 30px auto; max-width: 450px;">

        <p style="text-align: center; margin-bottom: 25px; color: #555;">
            Enter your admin username and recovery code to reset your password.
        </p>

        {% if error %}
            <p style="color: #b30000; text-align: center; margin-bottom: 20px;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <div style="margin-bottom: 20px;">
                <label>Admin Username</label>
                <input
                    type="text"
                    name="username"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box;"
                >
            </div>

            <div style="margin-bottom: 20px;">
                <label>Recovery Code</label>
                <input
                    type="password"
                    name="recovery_code"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box;"
                >
            </div>

            <div style="margin-bottom: 20px;">
                <label>New Password</label>
                <input
                    type="password"
                    name="new_password"
                    minlength="8"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box;"
                >
            </div>

            <div style="margin-bottom: 20px;">
                <label>Confirm New Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    minlength="8"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box;"
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary"
                style="border: none; cursor: pointer; width: 100%;"
            >
                Reset Password
            </button>

        </form>

        <div style="margin-top: 18px; text-align: center;">
            <a
                href="{{ url_for('admin_login') }}"
                style="color: #b30000; text-decoration: none; font-weight: bold;"
            >
                ← Back to Admin Login
            </a>
        </div>

    </div>

</section>

<footer>
    <p>Copyright 2026 Blood Donation Service.</p>
</footer>

</body>
</html>
