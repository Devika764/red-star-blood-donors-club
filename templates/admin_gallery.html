<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Activities and Photos - Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="logo">Blood Donation Admin</div>
    <div class="nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/">Home</a>
        <a href="/admin/logout">Logout</a>
    </div>
</nav>

<section class="section">
    <h2>All Activities &amp; Photos</h2>n

    <div class="card" style="margin: 20px auto; max-width: 900px; padding: 20px;">
        <h3>Upload Photos</h3>
        <form method="POST" action="{{ url_for('admin_gallery') }}" enctype="multipart/form-data">
            <input type="file" name="photos" accept="image/*" multiple required>
            <br><br>
            <input type="text" name="caption" placeholder="Caption (optional)" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
            <br><br>
            <input type="submit" value="Upload" style="background:#b30000; color:white; padding:12px 22px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
        </form>
    </div>

    <div class="card" style="margin: 20px auto; max-width: 1100px; padding: 20px;">
        <h3>Current Photos ({{ photos|length }})</h3>
        {% if photos %}
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px; margin-top:15px;">
            {% for p in photos %}
            <div style="background:#fff; border:1px solid #eee; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                <img src="{{ p.filename }}" style="width:100%; height:140px; object-fit:cover; display:block;">
                <div style="padding:8px;">
                    <form method="POST" action="{{ url_for('admin_edit_photo', id=p.id) }}" style="display:flex; gap:4px; margin-bottom:6px;">
                        <input type="text" name="caption" value="{{ p.caption or '' }}" placeholder="Caption" style="flex:1; min-width:0; font-size:12px; padding:5px; border:1px solid #ccc; border-radius:5px;">
                        <button type="submit" style="background:#1a73e8; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:12px;">Save</button>
                    </form>
                    <form method="POST" action="{{ url_for('admin_delete_photo', id=p.id) }}" onsubmit="return confirm('Delete this photo?');">
                        <button type="submit" style="width:100%; background:#d32f2f; color:white; border:none; padding:6px; border-radius:5px; cursor:pointer;">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p>No photos uploaded yet.</p>
        {% endif %}
    </div>
</section>

</body>
</html>
